<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allies — Campanhas de RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen" class="visible">
  <div class="center-wrap">
    <div class="tome">
      <div class="tome-eyebrow">Allies · Campanhas de RPG</div>
      <h1 id="auth-title">Abrir o Grimório</h1>
      <div class="auth-error" id="auth-error"></div>
      <form id="auth-form">
        <div class="field" id="field-nome" style="display:none;">
          <label for="nome">Nome do aventureiro</label>
          <input type="text" id="nome" autocomplete="name" />
        </div>
        <div class="field">
          <label for="usuario">Usuário</label>
          <input type="text" id="usuario" autocomplete="username" required pattern="[a-zA-Z0-9_]{3,20}" title="3 a 20 caracteres: letras, números ou underscore" />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="current-password" required minlength="6" />
        </div>
        <button type="submit" class="btn-seal" id="auth-submit">Entrar</button>
      </form>
      <div class="auth-switch">
        <span id="auth-switch-text">Ainda não tem conta?</span>
        <button type="button" id="auth-switch-btn">Criar conta</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="brand">Allies <small>Campanhas de RPG</small></div>
    <div class="header-right">
      <span class="header-user" id="header-user"></span>
      <button class="btn-ghost" id="logout-btn">Sair</button>
    </div>
  </header>

  <main>
    <!-- View: Dashboard de campanhas -->
    <section class="view active" id="view-dashboard">
      <div class="view-heading">
        <div>
          <h2>Suas Campanhas</h2>
          <div class="sub" id="dashboard-sub">carregando...</div>
        </div>
        <button class="btn-brass" id="nova-campanha-btn">+ Nova Campanha</button>
      </div>
      <div class="shelf" id="shelf"></div>
    </section>

    <!-- View: Detalhe da campanha -->
    <section class="view" id="view-campanha">
      <button class="btn-link-back" id="voltar-dashboard-btn">← Voltar às campanhas</button>
      <div class="view-heading">
        <div>
          <h2 id="campanha-nome"></h2>
          <div class="sub" id="campanha-sistema"></div>
        </div>
        <div class="heading-actions">
          <button class="btn-ghost-small" id="convidar-btn" style="display:none;">Convidar</button>
          <button class="btn-ghost-small" id="editar-campanha-btn" style="display:none;">Editar</button>
          <button class="btn-ghost-small btn-danger" id="excluir-campanha-btn" style="display:none;">Excluir</button>
          <button class="btn-ghost-small btn-danger" id="sair-campanha-btn" style="display:none;">Sair da campanha</button>
          <button class="btn-ghost-small" id="mesa-virtual-btn">Mesa Virtual</button>
          <button class="btn-brass" id="nova-ficha-btn">+ Nova Ficha</button>
        </div>
      </div>
      <p class="campaign-desc" id="campanha-desc"></p>
      <div class="participantes" id="participantes"></div>
      <div class="card-grid" id="fichas-grid"></div>
    </section>

    <!-- View: Ficha completa de personagem -->
    <section class="view" id="view-ficha">
      <button class="btn-link-back" id="voltar-campanha-btn">← Voltar à campanha</button>
      <div class="sheet-header">
        <input type="text" id="sheet-nome-personagem" class="sheet-nome-input" placeholder="Nome do personagem" />
        <div class="sheet-header-actions">
          <span class="sheet-readonly-note" id="sheet-readonly-note" style="display:none;">Somente leitura</span>
          <button class="btn-brass" id="salvar-ficha-btn">Salvar Ficha</button>
        </div>
      </div>

      <div class="sheet-tabs" id="sheet-tabs">
        <button class="sheet-tab active" data-tab="principal">Principal</button>
        <button class="sheet-tab" data-tab="pericias">Perícias &amp; Salvaguardas</button>
        <button class="sheet-tab" data-tab="combate">Combate &amp; Equipamento</button>
        <button class="sheet-tab" data-tab="personalidade">Personalidade &amp; História</button>
        <button class="sheet-tab" data-tab="magias">Magias</button>
      </div>

      <!-- Aba: Principal -->
      <div class="sheet-panel active" data-panel="principal">
        <div class="sheet-row">
          <div class="sheet-field"><label>Classe e Nível</label><input type="text" id="f-classe" /></div>
          <div class="sheet-field"><label>Antecedente</label><input type="text" id="f-antecedente" /></div>
          <div class="sheet-field"><label>Nome do Jogador</label><input type="text" id="f-jogador" /></div>
        </div>
        <div class="sheet-row">
          <div class="sheet-field"><label>Raça</label><input type="text" id="f-raca" /></div>
          <div class="sheet-field"><label>Alinhamento</label><input type="text" id="f-alinhamento" /></div>
          <div class="sheet-field"><label>Pontos de Experiência</label><input type="number" id="f-xp" /></div>
        </div>
        <div class="sheet-row">
          <div class="sheet-field sheet-field-checkbox">
            <label><input type="checkbox" id="f-inspiracao" /> Inspiração</label>
          </div>
          <div class="sheet-field"><label>Bônus de Proficiência</label><input type="number" id="f-prof-bonus" value="2" /></div>
          <div class="sheet-field"><label>Sabedoria Passiva (Percepção)</label><input type="number" id="f-sab-passiva" readonly /></div>
        </div>

        <div class="attr-block-grid" id="attr-block-grid"></div>

        <div class="sheet-field">
          <label>Outras Proficiências &amp; Idiomas</label>
          <textarea id="f-outras-prof" rows="3"></textarea>
        </div>
      </div>

      <!-- Aba: Perícias & Salvaguardas -->
      <div class="sheet-panel" data-panel="pericias">
        <div class="sheet-two-cols">
          <div>
            <h4 class="sheet-subtitle">Salvaguardas</h4>
            <div id="saves-list"></div>
          </div>
          <div>
            <h4 class="sheet-subtitle">Perícias</h4>
            <div id="pericias-list"></div>
          </div>
        </div>
      </div>

      <!-- Aba: Combate & Equipamento -->
      <div class="sheet-panel" data-panel="combate">
        <div class="sheet-row">
          <div class="sheet-field"><label>Classe de Armadura</label><input type="number" id="f-ca" /></div>
          <div class="sheet-field"><label>Iniciativa</label><input type="number" id="f-iniciativa" /></div>
          <div class="sheet-field"><label>Deslocamento</label><input type="text" id="f-deslocamento" placeholder="9m" /></div>
        </div>
        <div class="sheet-row">
          <div class="sheet-field"><label>Pontos de Vida Máximos</label><input type="number" id="f-pv-max" /></div>
          <div class="sheet-field"><label>Pontos de Vida Atuais</label><input type="number" id="f-pv-atual" /></div>
          <div class="sheet-field"><label>Pontos de Vida Temporários</label><input type="number" id="f-pv-temp" /></div>
        </div>
        <div class="sheet-row">
          <div class="sheet-field"><label>Dado de Vida (total)</label><input type="text" id="f-dado-vida-total" placeholder="ex: 3d8" /></div>
          <div class="sheet-field"><label>Dado de Vida (usado)</label><input type="text" id="f-dado-vida-usado" /></div>
        </div>

        <div class="death-save-block">
          <h4 class="sheet-subtitle">Salvaguarda contra Morte</h4>
          <div class="death-save-row">
            <span>Sucessos</span>
            <label><input type="checkbox" class="ds-sucesso" data-i="0" /></label>
            <label><input type="checkbox" class="ds-sucesso" data-i="1" /></label>
            <label><input type="checkbox" class="ds-sucesso" data-i="2" /></label>
          </div>
          <div class="death-save-row">
            <span>Falhas</span>
            <label><input type="checkbox" class="ds-falha" data-i="0" /></label>
            <label><input type="checkbox" class="ds-falha" data-i="1" /></label>
            <label><input type="checkbox" class="ds-falha" data-i="2" /></label>
          </div>
        </div>

        <h4 class="sheet-subtitle">Ataques &amp; Conjuração</h4>
        <div id="ataques-list"></div>
        <button type="button" class="btn-ghost-small" id="add-ataque-btn">+ Adicionar Ataque</button>

        <h4 class="sheet-subtitle">Moedas</h4>
        <div class="moedas-grid">
          <div class="sheet-field"><label>PC</label><input type="number" id="f-pc" /></div>
          <div class="sheet-field"><label>PP</label><input type="number" id="f-pp" /></div>
          <div class="sheet-field"><label>PE</label><input type="number" id="f-pe" /></div>
          <div class="sheet-field"><label>PO</label><input type="number" id="f-po" /></div>
          <div class="sheet-field"><label>PL</label><input type="number" id="f-pl" /></div>
        </div>

        <div class="sheet-field">
          <label>Equipamento</label>
          <textarea id="f-equipamento" rows="4"></textarea>
        </div>
      </div>

      <!-- Aba: Personalidade & História -->
      <div class="sheet-panel" data-panel="personalidade">
        <div class="sheet-row">
          <div class="sheet-field"><label>Traços de Personalidade</label><textarea id="f-tracos" rows="3"></textarea></div>
          <div class="sheet-field"><label>Ideais</label><textarea id="f-ideais" rows="3"></textarea></div>
        </div>
        <div class="sheet-row">
          <div class="sheet-field"><label>Vínculos</label><textarea id="f-vinculos" rows="3"></textarea></div>
          <div class="sheet-field"><label>Fraquezas</label><textarea id="f-fraquezas" rows="3"></textarea></div>
        </div>
        <div class="sheet-field">
          <label>Características &amp; Talentos</label>
          <textarea id="f-caracteristicas" rows="3"></textarea>
        </div>
        <div class="sheet-row">
          <div class="sheet-field"><label>Idade</label><input type="text" id="f-idade" /></div>
          <div class="sheet-field"><label>Altura</label><input type="text" id="f-altura" /></div>
          <div class="sheet-field"><label>Peso</label><input type="text" id="f-peso" /></div>
        </div>
        <div class="sheet-row">
          <div class="sheet-field"><label>Cor dos Olhos</label><input type="text" id="f-olhos" /></div>
          <div class="sheet-field"><label>Cor da Pele</label><input type="text" id="f-pele" /></div>
          <div class="sheet-field"><label>Cor do Cabelo</label><input type="text" id="f-cabelo" /></div>
        </div>
        <div class="sheet-field">
          <label>Aparência do Personagem</label>
          <textarea id="f-aparencia" rows="3"></textarea>
        </div>
        <div class="sheet-field">
          <label>Aliados &amp; Organizações</label>
          <textarea id="f-aliados" rows="3"></textarea>
        </div>
        <div class="sheet-field">
          <label>História do Personagem</label>
          <textarea id="f-historia" rows="4"></textarea>
        </div>
        <div class="sheet-field">
          <label>Tesouros</label>
          <textarea id="f-tesouros" rows="3"></textarea>
        </div>
      </div>

      <!-- Aba: Magias -->
      <div class="sheet-panel" data-panel="magias">
        <div class="sheet-row">
          <div class="sheet-field"><label>Classe Conjuradora</label><input type="text" id="f-classe-conjuradora" /></div>
          <div class="sheet-field"><label>Atributo de Conjuração</label><input type="text" id="f-attr-conjuracao" placeholder="ex: Inteligência" /></div>
          <div class="sheet-field"><label>CD para Evitar Suas Magias</label><input type="number" id="f-cd-magia" /></div>
          <div class="sheet-field"><label>Modificador de Ataque Mágico</label><input type="number" id="f-ataque-magico" /></div>
        </div>

        <div class="sheet-field">
          <label>Truques (Nível 0)</label>
          <textarea id="f-truques" rows="3" placeholder="Um truque por linha"></textarea>
        </div>

        <div id="magias-niveis"></div>
      </div>
    </section>
  </main>
</div>

<!-- ============ MODAL: Nova/Editar Campanha ============ -->
<div class="modal-backdrop" id="modal-campanha">
  <div class="modal">
    <h3 id="modal-campanha-titulo">Nova Campanha</h3>
    <form id="form-campanha">
      <div class="field">
        <label for="camp-nome">Nome da campanha</label>
        <input type="text" id="camp-nome" required />
      </div>
      <div class="field">
        <label for="camp-sistema">Sistema (D&D 5e, Tormenta20, etc)</label>
        <input type="text" id="camp-sistema" />
      </div>
      <div class="field">
        <label for="camp-desc">Descrição</label>
        <textarea id="camp-desc" rows="3"></textarea>
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn-seal" style="flex:1;">Salvar</button>
        <button type="button" class="btn-text" id="modal-campanha-cancelar">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ MODAL: Confirmação ============ -->
<div class="modal-backdrop" id="modal-confirmar">
  <div class="modal">
    <h3 id="modal-confirmar-titulo">Confirmar</h3>
    <p id="modal-confirmar-texto" style="color: var(--ink-soft); font-size: 14px; line-height: 1.5;"></p>
    <div class="modal-actions">
      <button type="button" class="btn-seal" id="modal-confirmar-ok" style="flex:1;">Confirmar</button>
      <button type="button" class="btn-text" id="modal-confirmar-cancelar">Cancelar</button>
    </div>
  </div>
</div>

<!-- ============ MODAL: Nova Ficha ============ -->
<div class="modal-backdrop" id="modal-nova-ficha">
  <div class="modal">
    <h3>Nova Ficha</h3>
    <form id="form-nova-ficha">
      <div class="field">
        <label for="nova-ficha-nome">Nome do personagem</label>
        <input type="text" id="nova-ficha-nome" required />
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn-seal" style="flex:1;">Criar</button>
        <button type="button" class="btn-text" id="modal-nova-ficha-cancelar">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ MODAL: Convidar Jogador ============ -->
<div class="modal-backdrop" id="modal-convidar">
  <div class="modal">
    <h3>Convidar Jogador</h3>
    <form id="form-convidar">
      <div class="field">
        <label for="convidar-usuario">Nome de usuário</label>
        <input type="text" id="convidar-usuario" required pattern="[a-zA-Z0-9_]{3,20}" placeholder="ex: gandalf42" />
      </div>
      <div class="modal-actions">
        <button type="submit" class="btn-seal" style="flex:1;">Convidar</button>
        <button type="button" class="btn-text" id="modal-convidar-cancelar">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
